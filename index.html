        [[0, hs], [0, -hs], [hs, 0], [-hs, 0]].forEach(([x, y]) => {
          const sx = x === 0 ? 5 : 2, sy = y === 0 ? 5 : 2;
          push({ k: "face", deep: P.flipBox > 0.95, pts: quad(x - sx, y - sy, x + sx, y + sy, -0.8).map(TA), out: COL.tape, inn: COL.tape, part: "B", op: 0.9, side: -1 });
        });
      }
      if (P.hole > 0.5) items.push({ k: "ball", deep: P.flipBox > 0.95, c: TA([0, 0, -0.5]), r: 0.7, fill: "#222222", part: "B" });
    }
    // ---- the tracing paper
    if (P.traceVis > 0.02) {
      const hs = pd.w / 2, m = Studio.ease(P.traceMove);
      const pts = [[-hs, -hs], [hs, -hs], [hs, hs], [-hs, hs]].map(q => Studio.lerp3(tD([q[0], q[1], 0.5], P), TCc([q[0], q[1], -0.4]), m));
      push({ k: "face", pts: pts, out: COL.trace, inn: COL.trace, part: "D", op: 0.78 * P.traceVis, side: m > 0.5 ? -1 : 1 });
      if (m > 0.99) [[0, hs], [0, -hs], [hs, 0], [-hs, 0]].forEach(([x, y]) => {
        const sx = x === 0 ? 6 : 2.5, sy = y === 0 ? 6 : 2.5;
        push({ k: "face", pts: quad(x - sx, y - sy, x + sx, y + sy, -0.8).map(TCc), out: COL.tape, inn: COL.tape, part: "D", op: 0.9, side: -1 });
      });
    }
    // ---- the pin (an adult uses it)
    if (P.pinVis > 0.02) {
      const tip = TA([0, 0, P.pinZ]), head = TA([0, 0, P.pinZ + 28]);
      items.push({ k: "line", pts: [tip, head], w: 1.6, color: COL.pin, part: "E", op: Math.min(1, P.pinVis) });
      items.push({ k: "ball", c: head, r: 2, fill: COL.pin, part: "E", op: Math.min(1, P.pinVis) });
      labels.push({ part: "E", p: head });
    }
    // ---- masking tape round the lid
    if (P.tape > 0.05) {
      const e = 0.35, zt = h, band = 8, op = 0.92 * Math.min(1, P.tape * 1.5);
      const mk = (pts) => push({ k: "face", pts: pts, out: COL.tape, inn: COL.tape, part: "A", op: op });
      mk([[w / 2 + e, -d / 2, zt - band], [w / 2 + e, d / 2, zt - band], [w / 2 + e, d / 2, zt], [w / 2 + e, -d / 2, zt]]);
      mk([[-w / 2 - e, -d / 2, zt - band], [-w / 2 - e, d / 2, zt - band], [-w / 2 - e, d / 2, zt], [-w / 2 - e, -d / 2, zt]]);
      mk([[-w / 2, d / 2 + e, zt - band], [w / 2, d / 2 + e, zt - band], [w / 2, d / 2 + e, zt], [-w / 2, d / 2 + e, zt]]);
      mk([[-w / 2, -d / 2 - e, zt - band], [w / 2, -d / 2 - e, zt - band], [w / 2, -d / 2 - e, zt], [-w / 2, -d / 2 - e, zt]]);
    }
    // ---- dashed guides in the exploded view
    if (P.explode > 0.05) {
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => items.push({ k: "line", pts: [[sx * w / 2, sy * d / 2, h], [sx * w / 2, sy * d / 2, h + 95 * P.explode]], w: 1, color: "#555", dash: "4 3", op: 0.8 }));
    }
    return { items: items, labels: labels };
  }

  return {
    id: "pinhole-camera", N: N, keys: keys, win: win_, base: 1, yaw: -0.55, pitch: 0.62, scene: scene,
    overview: [
      { title: "All the parts, cut out", caption: "The parts you make: A box net, B and D patterns, C lid frame, and the pin E.", step: 2, over: {} },
      { title: "Exploded view", caption: "The lid C sits on the open end of box A. The pinhole is in the foil on the base.", step: 10, over: { explode: 1, tape: 0 } }
    ],
    readout(P, step) {
      const r = [];
      if (step === 4) r.push("Colour on the inside: " + Math.round(P.blackA * 100) + "% black");
      if (step === 5) r.push("Foil moved onto the base: " + Math.round(Studio.ease(P.foilMove) * 100) + "%");
      if (step === 6) r.push("Pin height above the foil: " + Math.round(P.pinZ + 2) + " mm");
      if (step === 7) r.push("Walls folded: " + Math.round(P.fold * 90) + " degrees");
      if (step === 9) r.push("Tracing paper moved onto the lid: " + Math.round(Studio.ease(P.traceMove) * 100) + "%");
      if (step === 10) r.push("Lid height above the box: " + Math.max(0, Math.round(h * (1 - P.lidMove) + 45 * Math.sin(Math.PI * P.lidMove))) + " mm");
      return r;
    },
    tests: { tsign: tsign, wsign: wsign, tA: tA, tC: tC, tabDefs: tabDefs, Lp: Lp, foldTab: foldTab, hinge: hinge }
  };
}

function buildParachuteModel(g) {
  const get = id => g.parts.find(p => p.id === id);
  const pa = get("A"), pb = get("B"), pc = get("C");
  if (g.steps.length !== 7 || !pa || pa.type !== "disc" || Guide.marksOf(pa) < 3 || !pb || !pc) return null;
  const N = 7, R = pa.diam / 2, M = Guide.marksOf(pa), rm = 0.82 * R;
  const num = (str, dflt) => { const m = /(\d+(?:\.\d+)?)\s*mm/.exec(str || ""); return m ? Number(m[1]) : dflt; };
  const Lth = num(pb.size, 250), clayR = num(pc.size, 25) / 2, nTh = pb.qty;
  if (nTh !== M) return null;
  const Lay = Guide.layout(g);
  if (!Lay.pages || !Lay.pages[0]) return null;
  const it = Lay.pages[0].find(x => x.part.id === "A");
  const D0 = [it.x + it.sh.w / 2 - 105, 148.5 - (it.y + 6 + it.sh.h / 2), 0];
  const Zc = Lth + 10, knotZ = Zc - Math.sqrt(Lth * Lth - rm * rm);
  const K = (s, c) => Studio.keys(N, s, c);
  const keys = {
    scrap: K(1, { 2: 0 }), threadVis: K(0, { 3: 1 }), join: K(0, { 4: 1 }), gather: K(0, { 5: 1 }), clay: K(0, { 6: 1 }), explode: K(0),
    zoom: K(1.5, { 3: 1.25, 4: 0.95 }), tx: K(0), ty: K(0, { 3: -10, 4: 0 }), tz: K(0, { 4: Zc / 2 })
  };
  const win_ = { scrap: { 2: [0.2, 1] }, threadVis: { 3: [0, 0.4] }, join: { 4: [0.1, 1] }, gather: { 5: [0, 1] }, clay: { 6: [0.2, 1] },
    zoom: { 3: [0, 0.7], 4: [0, 0.8] }, ty: { 3: [0, 0.7], 4: [0, 0.8] }, tz: { 4: [0, 0.8] } };
  const quad = (x0, y0, x1, y1, z) => [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]];

  function scene(P) {
    const items = [], labels = [], push = f => items.push(f);
    if (P.scrap > 0.02) push({ k: "face", pts: quad(-105, -148.5, 105, 148.5, -0.6), out: COL.sheet, inn: COL.sheet, op: P.scrap });
    const j = Studio.ease(P.join);
    const cpos = [Studio.mix(D0[0], 0, j), Studio.mix(D0[1], 0, j), Zc * j];
    const SEG = 48, rim = [];
    for (let k = 0; k < SEG; k++) { const a = 2 * Math.PI * k / SEG; rim.push([cpos[0] + R * Math.cos(a), cpos[1] + R * Math.sin(a), cpos[2]]); }
    // the canopy: 8 wedges so the order of drawing stays right
    for (let w = 0; w < M; w++) {
      const a0 = Math.floor(w * SEG / M), a1 = Math.floor((w + 1) * SEG / M), pts = [cpos.slice()];
      for (let k = a0; k <= a1; k++) pts.push(rim[k % SEG]);
      push({ k: "face", pts: pts, out: COL.paper, inn: "#e3dfd5", part: "A" });
    }
    for (let m = 0; m < M; m++) {   // numbered thread points
      const a = -Math.PI / 2 + 2 * Math.PI * m / M;
      items.push({ k: "ball", c: [cpos[0] + rm * Math.cos(a), cpos[1] + rm * Math.sin(a), cpos[2] + 0.4], r: 1.8, fill: COL.dark, part: "A" });
    }
    labels.push({ part: "A", p: [cpos[0], cpos[1] - R * 0.55, cpos[2] + 0.5] });
    // the threads
    const knot = [0, 0, knotZ + 0];
    if (P.threadVis > 0.02) {
      for (let m = 0; m < nTh; m++) {
        const a = -Math.PI / 2 + 2 * Math.PI * m / M, rimPt = [rm * Math.cos(a), rm * Math.sin(a), Zc];
        const flatL = [-Lth / 2, -70 - 12 * m, 0.3], flatR = [Lth / 2, -70 - 12 * m, 0.3];
        const attach = Studio.lerp3(flatL, rimPt, j);
        const hang = [rimPt[0], rimPt[1], Zc - Lth];
        const free = Studio.lerp3(Studio.lerp3(flatR, hang, j), knot, Studio.ease(P.gather));
        items.push({ k: "line", pts: [attach, free], w: 1.5, color: COL.thread, part: "B", op: P.threadVis });
      }
      labels.push({ part: "B", p: Studio.lerp3([Lth / 2, -70 - 12 * 3.5, 0.3], [rm * 0.7, 0, Zc * 0.55], j) });
    }
    if (P.clay > 0.02) {
      const c = [0, -clayR * 0.6 * P.explode * 4 * 0, knotZ - P.explode * 55];
      items.push({ k: "ball", c: c, r: clayR * Studio.ease(P.clay), fill: COL.clay, part: "C" });
      labels.push({ part: "C", p: [c[0] + clayR + 4, c[1], c[2]] });
      if (P.explode > 0.05) items.push({ k: "line", pts: [knot, c], w: 1, color: "#555", dash: "4 3", op: 0.8 });
    }
    return { items: items, labels: labels };
  }
  return {
    id: "paper-parachute", N: N, keys: keys, win: win_, base: 1, yaw: -0.55, pitch: 0.55, scene: scene,
    overview: [
      { title: "The three parts", caption: "A canopy, B eight threads, C a clay weight. The clay is pulled down here so you can see it is a separate part.", step: 5, over: { explode: 1 } }
    ],
    readout(P, step) {
      const r = [];
      if (step === 3) r.push("Canopy height: " + Math.round(Zc * Studio.ease(P.join)) + " mm");
      if (step === 4) r.push("Threads gathered at the knot: " + Math.round(Studio.ease(P.gather) * 100) + "%");
      if (step === 5) r.push("Clay ball size: " + Math.round(2 * clayR * Studio.ease(P.clay)) + " mm across");
      return r;
    },
    tests: { Zc: Zc, knotZ: knotZ, rm: rm, Lth: Lth }
  };
}

const MODEL_BUILDERS = { "pinhole-camera": buildPinholeModel, "paper-parachute": buildParachuteModel };
function getModel(id, g) { const f = MODEL_BUILDERS[id]; return f ? f(g) : null; }

/* =====================================================================
   PART 2C: THE DEMO ENGINE (which parts move in which step)
   Pure data and decisions. The drawing is in the screens part.
   ===================================================================== */
const Demo = {
  timer: null,
  baseMs: 3500,          // time for one step at 1x speed (tests may change it)
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

  // One entry per written step, in the same order. "joins" = parts seen for the first time in this step.
  buildSteps(g) {
    const seen = {}, steps = [], first = {};
    const isPrint = t => /^\s*print\b/i.test(t);
    const idsOf = st => st.parts.map(x => (g.parts.find(p => p.id.toUpperCase() === x.toUpperCase()) || {}).id).filter(Boolean);
    // A "Print ..." step only gets the parts ready. A part joins the model at the first step that is not a printing step.
    g.steps.forEach((st, i) => {
      if (isPrint(st.text)) return;
      idsOf(st).forEach(id => { if (first[id] === undefined) first[id] = i; });
    });
    g.steps.forEach((st, i) => {
      if (!isPrint(st.text)) return;
      idsOf(st).forEach(id => { if (first[id] === undefined) first[id] = i; });
    });
    g.steps.forEach((st, i) => {
      const ids = idsOf(st);
      const joins = ids.filter(id => first[id] === i && !seen[id] && (seen[id] = true));
      steps.push({ n: i + 1, text: st.text, adult: !!st.adult, parts: ids, joins: joins });
    });
    return { steps: steps, first: first };
  },

  // Positions (in demo units) for the parts tray and the assembly area.
  layout(g, D) {
    const tray = {}, area = {};
    g.parts.forEach((p, i) => { tray[p.id] = { x: 20 + (i % 10) * 76, y: 346 + Math.floor(i / 10) * 66 }; });
    const order = Object.keys(D.first).sort((a, b) => D.first[a] - D.first[b] || g.parts.findIndex(p => p.id === a) - g.parts.findIndex(p => p.id === b));
    order.forEach((id, i) => { area[id] = { x: 24 + (i % 8) * 95, y: 26 + Math.floor(i / 8) * 94 }; });
    return { tray: tray, area: area };
  },

  // What every part looks like after step k (k = -1 is the start).
  stateAt(g, D, k) {
    return g.parts.map(p => {
      const f = D.first[p.id];
      return { id: p.id, placed: f !== undefined && f <= k, active: k >= 0 && D.steps[k].parts.includes(p.id), stepNo: f === undefined ? null : f + 1 };
    });
  }
};

/* =====================================================================
   PART 3: THE SCREENS (what the student sees)
   ===================================================================== */
const state = {
  asked: 0, answered: [], studentIdea: "", level: "", kind: "", candidates: [], pick: null,
  screening: { level: "ok", why: "", adult: false, notes: [] }, relaxed: false
};

// ----- small helpers that build the page -----
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return e;
}

function show(...nodes) {
  Demo.stop();
  if (typeof Figures !== "undefined") Figures.stop();
  const app = document.getElementById("app");
  app.replaceChildren(...nodes);
  const h = app.querySelector("h2");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus(); }   // helps screen readers
  window.scrollTo(0, 0);
}

function button(label, onClick, primary) {
  return el("button", { type: "button", class: "btn" + (primary ? " primary" : ""), onclick: onClick }, label);
}

function notice(kind, tag, ...kids) {
  return el("div", { class: "notice " + kind, role: kind === "stop" ? "alert" : "note" },
    el("strong", { class: "tag" }, tag), ...kids);
}

function byId(id) { return IDEAS.find(i => i.id === id); }
function topicLabel(id) { const t = TOPICS.find(x => x.id === id); return t ? t.label : id; }
function typeLabel(t) { return t === "working" ? "Working model (something moves or happens)" : "Display model (shows and explains)"; }
function ideaLine(i) { return (i.type === "working" ? "Working model" : "Display model") + " | " + i.difficulty + " | about " + i.hours + " hours"; }

// Cautions found in the student's own words (laser, batteries, advanced topics...).
function noteNotices() {
  return (state.screening.notes || []).map(n => notice("warn", n.tag, el("p", null, n.text)));
}

// ----- the screens -----
function showStart() {
  Object.assign(state, { asked: 0, answered: [], studentIdea: "", level: "", kind: "", candidates: [], pick: null,
    screening: { level: "ok", why: "", adult: false, notes: [] }, relaxed: false });
  show(
    el("h2", null, "Welcome!"),
    el("p", null, "I will help you plan a science exhibit for your school. I will ask you up to " + MAX_QUESTIONS +
      " short questions. Then I will check that your idea is safe. If I do not have a ready-made plan, I will help you plan it with Claude."),
    button("Start", showQ1, true),
    el("p", null, "Or just explore:"),
    button("Explore a labelled figure (cells, atoms, planets and more)", showFigureHome),
    el("p", { class: "small" }, el("a", { href: "docs/index.html" }, "How this project was made, how it works, and how well it was checked"))
  );
}

function showQ1() {
  const box = el("textarea", { id: "idea", rows: "3", maxlength: "300", "aria-describedby": "hint" });
  const level = el("input", { id: "level", type: "text", maxlength: "30", placeholder: "For example: Class 7" });
  show(
    el("p", { class: "progress" }, "Question 1 of up to " + MAX_QUESTIONS),
    el("h2", null, "What kind of science exhibit do you have in mind?"),
    el("label", { for: "idea" }, "Type your idea in a few words:"),
    box,
    el("p", { id: "hint", class: "small" }, "Any science topic is fine. Example: the human digestive system. If you have no idea yet, press the second button."),
    el("label", { for: "level" }, "Your class or age (optional):"),
    level,
    el("p", { class: "small" }, "This only helps Claude pitch the plan at the right level. It is never stored."),
    button("Next", () => submitQ1(box.value, level.value), true),
    button("I am not sure yet", () => submitQ1("not sure", level.value))
  );
}

function submitQ1(text, level) {
  state.asked = 1;
  state.level = String(level || "").trim();
  state.studentIdea = Engine.isUnsure(text) ? "" : text.trim();
  state.screening = Engine.screen(text);
  if (state.screening.level === "unsafe") return showRefuse(state.screening.why);
  route(text);
}

function route(text) {
  const r = Engine.first(text);
  state.kind = r.kind;
  if (r.kind === "unsure") return showTopicQuestion();
  if (r.kind === "none") return showNoMatch();
  state.candidates = r.candidates;
  refine();
}

function showTopicQuestion() {
  state.kind = "unsure";
  state.candidates = IDEAS.slice();
  showQuestion(QUESTIONS.topic);
}

function refine() {
  const q = Engine.nextQuestion(state.candidates, state.answered, state.asked, MAX_QUESTIONS);
  if (q) return showQuestion(q);
  finish();
}

function finish() {
  const c = state.candidates;
  // Exact match: go straight to the summary. Only related ideas: offer Claude first.
  if (c.length === 1 && state.kind !== "topic" && state.kind !== "weak") { state.pick = c[0]; return showSummary(); }
  if (state.kind === "topic" || state.kind === "weak") {
    return showPick(Engine.shortlist(c, 3), "I do not have an exact plan for that, but these ideas are related", true);
  }
  showPick(Engine.shortlist(c, 3), "Here are the best matches. Which one do you like?", false);
}

function showQuestion(q) {
  show(
    el("p", { class: "progress" }, "Question " + (state.asked + 1) + " of up to " + MAX_QUESTIONS),
    el("h2", null, q.text),
    ...q.options.map(o => button(o.label, () => answer(q.id, o.value)))
  );
}

function answer(qid, value) {
  state.asked += 1;
  state.answered.push(qid);
  if (qid === "topic" && value === "unsure") {
    state.candidates = STARTERS.map(byId);
    return showPick(state.candidates, "No problem! Here are three easy ideas to start with. Which one do you like?", false);
  }
  const r = Engine.applyAnswer(state.candidates, qid, value);
  state.candidates = r.candidates;
  state.relaxed = state.relaxed || r.relaxed;
  if (qid === "topic") state.kind = "idea";   // the student chose this topic on purpose
  refine();
}

function showPick(list, title, claudeFirst) {
  const claudeBtn = button("Plan my own idea with Claude (recommended)", () => showAssisted(), claudeFirst);
  const nodes = [el("h2", null, title)];
  if (state.studentIdea && claudeFirst) {
    nodes.push(el("p", null, "You asked for: “" + state.studentIdea + "”"));
  }
  nodes.push(...noteNotices());
  if (claudeFirst) nodes.push(claudeBtn);
  nodes.push(...list.map(i => button(
    [el("strong", null, i.title), el("br"), el("span", { class: "small" }, ideaLine(i)), el("br"), el("span", { class: "small" }, i.concept)],
    () => { state.pick = i; showSummary(); })));
  if (!claudeFirst) nodes.push(button("None of these: plan my own idea with Claude", () => showAssisted()));
  show(...nodes);
}

function safetyNotice(i, s) {
  if (i.safety === "adult" || (s && s.adult)) {
    return notice("warn", "Ask an adult",
      el("p", null, "Ask an adult to help or supervise any step that uses heat, flame, hot water, electricity or sharp tools."),
      el("p", null, i.safetyNote));
  }
  return notice("ok", "Safety tip", el("p", null, i.safetyNote));
}

function showSummary() {
  const i = state.pick;
  const rows = [
    ["Exhibit idea", i.title],
    ["Science concept", i.concept],
    ["Topic area", topicLabel(i.topic)],
    ["Type", typeLabel(i.type)],
    ["Difficulty", i.difficulty],
    ["Build time", "About " + i.hours + " hours"],
    ["Main materials", i.materials.join(", ")],
    ["Where to get them", i.cost === "home" ? "Things you probably have at home" : "Home items plus a few cheap items from a stationery or hardware shop"]
  ];
  const nodes = [
    el("h2", null, "Here is what I understood"),
    el("div", { class: "card" }, el("dl", null, ...rows.flatMap(r => [el("dt", null, r[0]), el("dd", null, r[1])])))
  ];
  if (state.studentIdea) nodes.push(el("p", { class: "small" }, "You said: “" + state.studentIdea + "”"));
  nodes.push(safetyNotice(i, state.screening));
  nodes.push(...noteNotices());
  nodes.push(notice("note", "Check before you build",
    el("p", null, "Ask a teacher or an adult to check your plan. Check that the topic fits your syllabus and level.")));
  if (state.relaxed) nodes.push(notice("note", "Note", el("p", null, "I could not match all of your choices, so I picked the closest ideas.")));
  nodes.push(button("Yes, this is right", showConfirmed, true));
  nodes.push(button("No, change my answers", showStart));
  show(...nodes);
}

function makePlan(i) {
  return {
    source: "library",
    studentIdea: state.studentIdea,
    classOrAge: state.level,
    ideaId: i.id,
    title: i.title,
    topicArea: topicLabel(i.topic),
    concept: i.concept,
    type: i.type,
    difficulty: i.difficulty,
    buildHours: i.hours,
    materials: i.materials,
    materialsSource: i.cost,
    adultHelpNeeded: i.safety === "adult" || state.screening.adult,
    safetyNote: i.safetyNote,
    cautions: (state.screening.notes || []).map(n => n.tag),
    questionsAsked: state.asked
  };
}

function showConfirmed() {
  const plan = makePlan(state.pick);
  window.__plan = plan;
  const has = !!GUIDES[state.pick.id];
  const nodes = [
    el("h2", null, "Great! Your plan is saved"),
    el("p", null, "This is your exhibit plan."),
    el("pre", null, JSON.stringify(plan, null, 2))
  ];
  if (has) {
    nodes.push(el("p", null, "I have a complete, ready-made guide for this exhibit, with parts, printable templates and numbered steps."));
    nodes.push(button("Build my guide", () => openBuiltIn(state.pick.id), true));

  if (sh.hole) g.append(svgEl("rect", Object.assign({ x: sh.hole.x, y: sh.hole.y, width: sh.hole.w, height: sh.hole.h }, cut)));

      if ((a.to > a.from && ctl.t >= 1) || (a.to < a.from && ctl.t <= 0)) { ctl.t = 1; ctl.step = a.finalStep; ctl.anim = null; if (ctl.playing) ctl.hold = 900 / ctl.speed; }
      paint(); return;
    }
    if (ctl.playing) {
      ctl.hold -= dt;
      if (ctl.hold <= 0) { if (ctl.target >= total - 1) pause(); else go(ctl.target + 1); }
    }
  }
  function go(to) {
    to = Math.max(-1, Math.min(total - 1, to));
    if (ctl.anim) { ctl.step = ctl.target; ctl.t = 1; ctl.anim = null; }
    if (to === ctl.step) { ctl.target = to; setCaption(); setButtons(); paint(); return; }
    ctl.target = to;
    if (dur() === 0 || Math.abs(to - ctl.step) !== 1) { ctl.step = to; ctl.t = 1; }
    else if (to > ctl.step) { ctl.step = to; ctl.t = 0; ctl.anim = { from: 0, to: 1, finalStep: to }; }
    else { ctl.anim = { from: 1, to: 0, finalStep: to }; }

    if (ctl.anim) ensureLoop();
  }
  function pause() { ctl.playing = false; setButtons(); }
  function play() {
    if (ctl.target >= total - 1 && !ctl.anim) go(-1);
    ctl.playing = true; ctl.hold = 0; setButtons(); go(ctl.target + 1); ensureLoop();
  }
  const mk = (id, label, primary, fn) => { const b = el("button", { type: "button", class: "btn" + (primary ? " primary" : ""), id: id }, label); b.addEventListener("click", fn); return b; };
  buttons.play = mk("demoPlay", "Play", true, () => { if (ctl.playing) pause(); else play(); });
  buttons.prev = mk("demoPrev", "Previous", false, () => { pause(); go(ctl.target - 1); });
  buttons.next = mk("demoNext", "Next", false, () => { pause(); go(ctl.target + 1); });
  buttons.restart = mk("demoRestart", "Restart", false, () => { pause(); go(-1); });
  const turnL = mk("demoTurnL", "Turn left", false, () => { ctl.yaw -= 0.35; paint(); });
  const turnR = mk("demoTurnR", "Turn right", false, () => { ctl.yaw += 0.35; paint(); });
  const tilt = mk("demoTilt", "Reset view", false, () => { ctl.yaw = model.yaw; ctl.pitch = model.pitch; paint(); });
  const speed = el("select", { id: "demoSpeed", "aria-label": "Speed" }, ...["0.5", "1", "2"].map(v => el("option", Object.assign({ value: v }, v === "1" ? { selected: "selected" } : {}), v + "x")));
  speed.addEventListener("change", () => { ctl.speed = parseFloat(speed.value); });
  const reduce = el("input", { type: "checkbox", id: "demoReduce" });
  const mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  if (mq && mq.matches) { reduce.checked = true; ctl.reduce = true; }
  reduce.addEventListener("change", () => { ctl.reduce = reduce.checked; });

  // drag to turn
  let drag = null;
  svg.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; try { svg.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    ctl.yaw += (e.clientX - drag.x) * 0.012; ctl.pitch = Math.max(0.2, Math.min(1.35, ctl.pitch + (e.clientY - drag.y) * 0.008));
    drag = { x: e.clientX, y: e.clientY }; paint();
  });
  const endDrag = () => { drag = null; };
  svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);

  const box = el("div", { class: "demo-wrap", tabindex: "0", "aria-label": "3D assembly demo. Left and right arrow keys change step. Hold Shift with the arrow keys to turn the model." },
    svg, readout,
    el("div", { class: "demo-controls" }, buttons.play, buttons.prev, buttons.next, buttons.restart,
      el("label", { for: "demoSpeed", style: "display:inline;margin:0" }, "Speed:"), speed,
      el("label", { for: "demoReduce", style: "display:inline;margin:0" }, reduce, " Reduce motion")),
    el("div", { class: "demo-controls" }, turnL, turnR, tilt),
    cap);
  box.addEventListener("keydown", e => {
    if (e.target !== box) return;
    if (e.shiftKey && e.key === "ArrowLeft") { e.preventDefault(); ctl.yaw -= 0.2; paint(); }
    else if (e.shiftKey && e.key === "ArrowRight") { e.preventDefault(); ctl.yaw += 0.2; paint(); }
    else if (e.shiftKey && e.key === "ArrowUp") { e.preventDefault(); ctl.pitch = Math.min(1.35, ctl.pitch + 0.1); paint(); }
    else if (e.shiftKey && e.key === "ArrowDown") { e.preventDefault(); ctl.pitch = Math.max(0.2, ctl.pitch - 0.1); paint(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); buttons.next.click(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); buttons.prev.click(); }
  });
  setCaption(); setButtons(); paint();
  const sec = section("Watch it go together", "noprint",
    el("p", null, "A 3D model of your exhibit that goes together step by step. Press Play, or use Next and Previous. Drag the picture, or use the Turn buttons, to look from another side. The blue letters are the part letters from the parts list, and the part in the current step has a blue outline."),
    box);
  sec.__demo = { ctl: ctl, go: go, advance: advance, paint: paint, model: model, pause: pause, play: play, total: total };
  return sec;
}

  }

/* =====================================================================
   PART 2F: LABELLED FIGURES (cells, atoms, animals, planets, any topic)
   A figure is a picture made of named parts. The student taps a part (or
   presses its button) and reads about it. Some parts can move in orbits.
   Figures built into the app are checked by exactly the same code that
   checks figures drawn by Claude.
   ===================================================================== */
Object.assign(SCENE.FILLS, { pink: "#f4b6c2", green: "#a8d8a0", blue: "#9cc3ec", yellow: "#f6e08a", orange: "#f2b27a",
  purple: "#c9aee6", red: "#e8837c", teal: "#8fd3cf", brown: "#a67c52", sky: "#e3f1fb" });

const FIG = { MAX_PARTS: 12, MAX_ITEMS: 40, MAX_ORBITS: 12, W: 400, H: 300 };

const Figures = {
  raf: null, paused: false,
  stop() { if (this.raf) { (window.cancelAnimationFrame || clearTimeout)(this.raf); this.raf = null; } },

  // Check and clean a figure. Returns { fig, problems }. Only known fields are copied.
  clean(raw) {
    const problems = [];
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { fig: null, problems: ["The figure must be one object."] };
    const T = (v, max, what, need) => {
      const s = typeof v === "string" ? v.replace(/\s+/g, " ").trim() : "";
      if (!s) { if (need) problems.push(what + " is missing."); return ""; }
      if (s.length > max) { problems.push(what + " is longer than " + max + " characters."); return ""; }
      if (/[<>]|https?:|www\./i.test(s)) { problems.push(what + " contains a web address or code characters."); return ""; }
      return s;
    };
    const fig = { title: T(raw.title, 60, "The title", true), intro: T(raw.intro, 240, "The intro", false), note: T(raw.note, 240, "The note", false), parts: [], orbits: [] };

    detail: "The Sun is a star. It is a huge ball of hot gas, mostly hydrogen and helium, and it gives out light and heat because of nuclear fusion in its core. It holds about 99.8% of all the mass in the solar system, and its gravity keeps the planets in orbit.",
    items: [{ t: "circle", cx: 200, cy: 150, r: 16, fill: "yellow", stroke: "ink", sw: 2 }] }];
  const orbits = [];
  names.forEach((n, i) => {
    parts.push({ name: n, summary: sum[i], detail: det[i], at: [Math.round(200 + rx[i] * Math.cos((i % 2 ? -120 : -60) * Math.PI / 180)), Math.round(150 + rx[i] * 0.7 * Math.sin((i % 2 ? -120 : -60) * Math.PI / 180))], items: [] });
    orbits.push({ part: i + 2, cx: 200, cy: 150, rx: rx[i], ry: Math.round(rx[i] * 0.7), r: rr[i], seconds: sec[i], fill: fills[i], phase: i * 0.8, path: true });
  });
  return { title: "The solar system", intro: "Eight planets go round the Sun. Tap a planet or the Sun to read about it.",
    note: "Not to scale. Real distances and sizes are far bigger and the speeds here are only for show. Real orbits take from 88 days (Mercury) to about 165 years (Neptune).",
    parts: parts, orbits: orbits };
}
const FIGURES = { "animal-cell": { label: "An animal cell", make: figCell }, "carbon-atom": { label: "A carbon atom (Bohr model)", make: figCarbon }, "solar-system": { label: "The solar system", make: figSolar } };

// ----- screens for the figures -----
function showFigureHome() {
  const topic = el("input", { id: "figTopic", type: "text", maxlength: "80", placeholder: "For example: parts of a flower, human heart, water cycle" });
  const level = el("input", { id: "figLevel", type: "text", maxlength: "30", placeholder: "For example: Class 8" });
  const msg = el("div", { role: "alert" });
  show(
    el("h2", null, "Explore a labelled figure"),
    el("p", null, "Tap the parts of a picture to read about them, watch things move, and test yourself. Choose a ready-made figure:"),
    el("ul", { class: "figchoices" }, ...Object.keys(FIGURES).map(id => el("li", null, button(FIGURES[id].label, () => openFigure(id), true)))),
    el("h3", null, "Need a different topic?"),
    el("p", null, "Claude can draw a figure for any topic: cells, atoms, animals, plants, the body, planets and more."),
    el("label", { for: "figTopic" }, "Topic:"), topic,
    el("label", { for: "figLevel" }, "Your class or age (optional):"), level,
    msg,
    button("Plan it with Claude", () => {
      const t = topic.value.replace(/\s+/g, " ").trim();
      if (!t) { msg.replaceChildren(notice("warn", "Problem", el("p", null, "Type a topic first."))); return; }
      if (Engine.screen(t).level === "unsafe") { msg.replaceChildren(notice("warn", "Problem", el("p", null, Engine.screen(t).why))); return; }
      showFigureAssisted(t, level.value.trim());
    }, true),
    button("Back to the start", showStart));
}
function openFigure(id) {
  const f = FIGURES[id], r = Figures.clean(f.make());
  if (!r.fig) { show(el("h2", null, "Sorry"), notice("warn", "Problem", el("ul", null, ...r.problems.map(p => el("li", null, p)))), button("Back", showFigureHome)); return; }
  showFigure(r.fig, showFigureHome, true);
}
function showFigure(fig, back, builtIn) {
  show(el("h2", null, fig.title), fig.intro ? el("p", null, fig.intro) : null,
    notice("note", "About this figure", el("p", null, builtIn
      ? "This figure is built into Exhibit Buddy. A teacher should still check the science facts."
      : "Claude drew this figure and Exhibit Buddy checked that it is well formed. The app cannot check the science, so ask a teacher to read it."),
      fig.note ? el("p", null, el("strong", null, "Note: "), fig.note) : null),
    Figures.render(fig),
    el("p", { class: "noprint" }, button("Print this page", () => window.print()), " ", button("Back", back)));
}
function showFigureAssisted(topic, level) {
  const prompt = Figures.prompt(topic, level);
  const box = el("textarea", { id: "figPromptBox", rows: "10", readonly: "readonly", "aria-label": "Prompt to copy into Claude" });
  box.value = prompt;
  const status = el("p", { class: "small", role: "status" });
  const reply = el("textarea", { id: "figReply", rows: "8" });
  const out = el("div", { id: "figOut", role: "alert" });
  const link = el("a", { class: "btn primary", href: claudeUrl(prompt), target: "_blank", rel: "noopener noreferrer", onclick: () => copyText(prompt, status, "figPromptBox") }, "Open Claude with this prompt (opens a new tab)");
  show(el("h2", null, "Plan it with Claude"),
    el("h3", null, "Step 1: send the prompt to Claude"),
    el("p", null, "Press the blue button. Claude opens in a new tab with the prompt filled in. If the box is empty, click in it and press Ctrl+V (Cmd+V on a Mac), because I also copied the prompt for you."),
    link, status,
    el("details", null, el("summary", null, "Show or copy the prompt"), box, button("Copy the prompt again", () => copyText(prompt, status, "figPromptBox"))),
    el("h3", null, "Step 2: paste Claude's code block here"),
    el("label", { for: "figReply" }, "Claude's code block:"), reply,
    button("Show my figure", () => {
      const r = Figures.parse(reply.value);
      if (!r.fig) { out.replaceChildren(notice("warn", "Problem", el("ul", null, ...r.errors.slice(0, 8).map(e => el("li", null, e))), el("p", null, "Copy the problems and ask Claude to fix them, then paste the new code block."))); return; }
      showFigure(r.fig, () => showFigureAssisted(topic, level), false);
    }, true), out,
    button("Back", showFigureHome));
}

// Start the app when the page has loaded. (Also shared so the tests can reach the engine.)
window.__exhibitBuddy = { Studio, FIGURES, Figures, Scenes, Engine, Guide, Demo, GUIDES, IDEAS, TOPICS, QUESTIONS, state };
document.addEventListener("DOMContentLoaded", showStart);
</script>

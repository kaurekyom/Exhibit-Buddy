<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exhibit Buddy</title>
<style>
  /* ---------- Colours and basic look ---------- */
  :root {
    --ink: #1b1b1b;
    --bg: #ffffff;
    --panel: #f3f6fa;
    --line: #8a96a8;
    --primary: #0b4f9c;
    --primary-ink: #ffffff;
    --warn-bg: #fff4e0;
    --warn-line: #7a3e00;
    --stop-bg: #fdeaea;
    --stop-line: #8b0000;
    --ok-bg: #e8f6ec;
    --ok-line: #14532d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  header { background: var(--primary); color: var(--primary-ink); padding: 14px 16px; }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 2px 0 0; font-size: 0.95rem; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 1.35rem; margin: 0.2em 0 0.5em; }
  h2:focus { outline: 3px solid var(--primary); outline-offset: 4px; }

  /* ---------- Boxes and buttons ---------- */
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 14px; margin: 12px 0; }
  .btn {
    display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 10px 14px;
    font: inherit; text-align: left; color: var(--ink); background: #fff;
    border: 2px solid var(--primary); border-radius: 10px; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: #e6effa; }
  .btn.primary, .btn.primary:visited { background: var(--primary); color: var(--primary-ink); font-weight: 600; }
  .btn.primary:hover { background: #093d79; }
  .btn:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  textarea, input[type=text] { width: 100%; font: inherit; padding: 10px; border: 2px solid var(--line); border-radius: 8px; }
  label { font-weight: 600; display: block; margin: 10px 0 4px; }

  /* Notices always start with a WORD (Warning, Stop...), so colour is never the only clue */
  .notice { border: 3px solid; border-radius: 10px; padding: 12px; margin: 12px 0; }
  .notice p, .notice ul { margin: 6px 0; }
  .notice .tag { display: block; font-size: 1.05rem; }
  .notice.warn { background: var(--warn-bg); border-color: var(--warn-line); color: #3b1f00; }
  .notice.stop { background: var(--stop-bg); border-color: var(--stop-line); color: #4a0000; }
  .notice.ok   { background: var(--ok-bg);   border-color: var(--ok-line);   color: #0b2e1a; }
  .notice.note { background: #eef2f7;        border-color: var(--line);      color: var(--ink); }

  .progress { font-size: 0.95rem; color: #333; margin-bottom: 6px; }
  .small { font-size: 0.9rem; color: #333; }
  dl { margin: 0; } dt { font-weight: 700; margin-top: 8px; } dd { margin: 0; }
  pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 2px solid var(--line); border-radius: 8px; padding: 10px; font-size: 0.85rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- Guide pages ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; padding: 0; list-style: none; }
  .chip { display: inline-block; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 0.9rem; background: #fff; }
  .guide-section { margin: 22px 0; }
  .guide-section h3 { font-size: 1.2rem; margin: 0 0 8px; border-bottom: 3px solid var(--primary); padding-bottom: 4px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  .partcard { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .partcard .partdraw { flex: 0 1 240px; }
  .partcard .partdraw svg { width: 100%; height: auto; background: #fff; border: 1px solid var(--line); }
  .partcard .parttext { flex: 1 1 200px; }
  .partcard h4 { margin: 0 0 4px; font-size: 1.05rem; }
  .steps { padding-left: 1.4em; }
  .steps li { margin: 12px 0; }
  .adulttag { display: inline-block; font-weight: 700; border: 2px solid var(--warn-line); background: var(--warn-bg); color: #3b1f00; border-radius: 6px; padding: 0 8px; margin-right: 6px; }
  .checklist { list-style: none; padding: 0; }
  .checklist li { margin: 8px 0; }
  .checklist input { width: 22px; height: 22px; margin-right: 8px; vertical-align: middle; }
  details { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  .sheet { display: block; width: 100%; height: auto; max-width: 210mm; background: #fff; border: 1px solid var(--line); margin: 10px auto; }
  .pass { font-weight: 700; }
  .fail { font-weight: 700; text-decoration: underline; }

  /* ---------- Assembly demo ---------- */
  .demo-wrap { border: 2px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel); }
  .demo-svg { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--line); }
  .demo-svg .tile { transform-origin: 0 0; transition: transform 0.9s ease; }
  .demo-svg.nomotion .tile { transition: none; }
  .demo-svg .shape polygon, .demo-svg .shape circle, .demo-svg .shape rect, .demo-svg .shape line, .demo-svg .shape path { vector-effect: non-scaling-stroke; stroke-width: 1.2px; }
  .demo-svg .shape text { display: none; }
  .demo-svg .tilebox { fill: #fff; stroke: #8a96a8; stroke-width: 1.5px; }
  .demo-svg .tile.active .tilebox { fill: #e6effa; stroke: var(--primary); stroke-width: 5px; }
  .demo-svg .badge { display: none; }
  .demo-svg .tile.placed .badge { display: inline; }
  .demo-svg .zone { fill: none; stroke: #8a96a8; stroke-width: 1.5px; stroke-dasharray: 6 4; }
  .demo-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .demo-controls .btn { width: auto; display: inline-block; margin: 0; min-width: 96px; text-align: center; }
  .demo-controls select { font: inherit; padding: 8px; min-height: 48px; border: 2px solid var(--primary); border-radius: 10px; background: #fff; }
  .demo-caption { min-height: 4.5em; margin: 6px 0; }
  .demo-count { font-weight: 700; }
  .figbox { margin: 12px 0; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; break-inside: avoid; }
  .figbox figcaption { font-size: 0.95rem; margin-top: 6px; }
  .studio-svg, .scene { display: block; width: 100%; height: auto; background: #f3f7fc; border-radius: 8px; touch-action: pan-y; }
  .studio-svg.live { touch-action: none; cursor: grab; }
  .steps .figbox { max-width: 420px; }
  .studio-readout { min-height: 1.6em; font-weight: 600; margin: 6px 0; }
  .addpics textarea { margin: 6px 0; }
  .fig-part { cursor: pointer; }
  .fig-part:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  .fig-part.sel *:not(text) { stroke: #0b4f9c !important; stroke-width: 3.5px !important; }
  .figlist { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .figlist .btn, .figchoices .btn { margin: 0; width: 100%; text-align: left; }
  .figlist .btn[aria-pressed=true] { background: #dce9fa; border-color: var(--primary); }
  .figchoices { list-style: none; padding: 0; }
  .figquiz { margin: 8px 0; }
  label.inline { display: inline; font-weight: 400; margin-right: 12px; }

  @media print {
    @page { size: A4; margin: 0; }
    header, .noprint { display: none !important; }
    main { max-width: none; padding: 0; }
    .guide-section { padding: 0 12mm; }
    .guide-section.templates { padding: 0; margin: 0; }
    .sheet { width: 210mm !important; height: 297mm !important; max-width: none; margin: 0; border: none; break-after: page; page-break-after: always; }
    .sheetborder { display: none; }
    body.print-templates #app > :not(.templates) { display: none; }
    body.print-templates .templates > :not(.sheet) { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Exhibit Buddy</h1>
  <p>Plan your science exhibit</p>
</header>
<main id="app"></main>

<script>
"use strict";

/* =====================================================================
   PART 1: DATA
   This is the "brain's memory": topics, exhibit ideas and safety rules.
   To add a new idea later, copy one block in IDEAS and change the words.
   ===================================================================== */

// The science topic areas. "words" help the app guess a topic from what you type.
const TOPICS = [
  { id: "motion-force", label: "Motion, force and laws of motion",
    words: ["motion", "speed", "velocity", "force", "newton", "momentum", "inertia", "acceleration", "collision", "push", "pull"] },
  { id: "gravity", label: "Gravity, floating and sinking",

    words: ["electricity", "electric", "circuit", "battery", "current", "bulb", "magnet", "magnetic", "electromagnet", "switch", "voltage", "conductor", "insulator"] },
  { id: "matter", label: "Matter and mixtures",

    words: ["chemical", "reaction", "acid", "base", "gas", "foam", "froth", "volcano", "vinegar", "baking soda", "rust", "indicator", "fizz", "carbon dioxide"] },
  { id: "atom", label: "Atoms and molecules",
    words: ["atom", "atomic", "electron", "proton", "neutron", "nucleus", "molecule", "shell"] },
  { id: "cell", label: "Cells and tissues",
    words: ["cell", "tissue", "organelle", "nucleus", "membrane", "plant cell", "animal cell"] },
  { id: "body", label: "The human body",

  { id: "living", label: "Plants, animals and health",
    words: ["classification", "kingdom", "species", "animal", "plant", "diversity", "germ", "disease", "health", "hygiene", "bacteria", "virus", "infection", "seed", "germination", "photosynthesis", "leaf"] },

  { id: "resources", label: "Natural resources, food and environment",

/* Each idea has:
   type    = "working" (something moves or happens) or "static" (a model that shows and explains)
   cost    = "home" (things found at home) or "cheap" (a few cheap shop items)
   safety  = "low" or "adult" (an adult must help) */

  { id: "balloon-rocket", title: "Balloon Rocket", topic: "motion-force",
    concept: "Newton's third law: every action has an equal and opposite reaction.",
    type: "working", difficulty: "easy", hours: 2, cost: "cheap",
    materials: ["balloon", "string", "drinking straw", "tape"],
    safety: "low", safetyNote: "Do not blow up a balloon if you are allergic to latex. Never point the balloon at anyone's face.",
    keywords: ["balloon", "rocket", "jet", "thrust", "third law", "action reaction", "propulsion"] },

  { id: "paper-parachute", title: "Paper Parachute", topic: "gravity",

    type: "working", difficulty: "easy", hours: 2, cost: "home",
    materials: ["paper or thin plastic sheet", "thread", "small weight (coin or clay ball)", "scissors"],
    safety: "low", safetyNote: "Drop it from a low, safe height such as a table. Never from a balcony or roof.",
    keywords: ["parachute", "air resistance", "drag", "free fall", "falling", "descent"] },

  { id: "newtons-cradle", title: "Newton's Cradle", topic: "motion-force",

    type: "working", difficulty: "medium", hours: 4, cost: "cheap",
    materials: ["5 equal steel balls or equal marbles", "thread", "cardboard or ice-cream sticks for the frame", "tape or glue"],
    safety: "low", safetyNote: "Keep your fingers clear of the swinging balls.",
    keywords: ["cradle", "momentum", "collision", "conservation of momentum", "swinging balls"] },

  { id: "car-ramp-speed", title: "Toy Car Speed Tracker", topic: "motion-force",
    concept: "Speed, average speed and the distance-time graph.",
    type: "working", difficulty: "medium", hours: 4, cost: "home",
    materials: ["toy car", "board or thick cardboard for a ramp", "books", "measuring tape or ruler", "phone stopwatch"],
    safety: "low", safetyNote: "Keep the ramp away from the table edge so the car does not fall on someone's foot.",
    keywords: ["speed", "velocity", "distance time", "ramp", "toy car", "average speed", "stopwatch", "graph"] },

  { id: "marble-coaster", title: "Marble Roller Coaster", topic: "energy",
    concept: "Potential energy changes into kinetic energy as the marble rolls down.",
    type: "working", difficulty: "medium", hours: 5, cost: "cheap",

    keywords: ["roller coaster", "coaster", "marble", "track", "potential energy", "kinetic energy", "energy"] },

  { id: "cartesian-diver", title: "Cartesian Diver", topic: "gravity",

    safety: "low", safetyNote: "Use a plastic bottle, never a glass one.",

  { id: "string-phone", title: "String Telephone", topic: "sound",
    concept: "Sound needs a medium to travel. Vibrations can travel along a stretched string.",

    materials: ["2 paper or plastic cups", "a few metres of string", "paper clips or knots to hold the string", "a pencil to make holes"],

    keywords: ["string phone", "string telephone", "cup phone", "tin can phone", "telephone", "medium"] },

  { id: "rubber-band-guitar", title: "Rubber Band Guitar", topic: "sound",
    concept: "Pitch depends on frequency. A shorter or tighter vibrating band gives a higher pitch.",
    type: "working", difficulty: "easy", hours: 1, cost: "home",
    materials: ["empty box", "rubber bands of different thickness", "pencils or sticks as bridges"],
    safety: "low", safetyNote: "Never stretch rubber bands near your face. A snapping band can hurt your eyes.",

  { id: "water-xylophone", title: "Water Glass Xylophone", topic: "sound",

  { id: "periscope", title: "Periscope", topic: "light",

    materials: ["2 small flat (plane) mirrors", "long cardboard box or milk carton", "tape", "ruler and protractor", "craft paper"],

  { id: "simple-circuit", title: "Simple Circuit and Switch", topic: "electricity",

    materials: ["2 AA cells (1.5 V each) with a battery holder", "small torch bulb rated about 3 V, with a holder", "insulated wires", "paper clip, drawing pins and card for the switch", "tape"],
    safety: "adult", safetyNote: "Use batteries only. Never connect wires to a wall socket or mains supply. Ask an adult to check your connections, and disconnect if a wire or battery gets warm.",

    safety: "adult", safetyNote: "Ask an adult to cut thermocol or thick card with a craft knife.",
    keywords: ["cell", "cell model", "plant cell", "animal cell", "organelle", "mitochondria", "chloroplast", "vacuole", "cell wall", "nucleus"] },

    materials: ["chart paper or thick card for the body outline", "soft tubing, rope or thick wool for the food pipe and intestines", "clay or coloured paper for the stomach, liver and pancreas", "glue", "labels and markers"],

    keywords: ["digestive system", "digestion", "digestive", "stomach", "intestine", "oesophagus", "esophagus", "liver", "pancreas", "human body", "food pipe", "alimentary canal"] },

/* =====================================================================
   PART 2: THE ENGINE (the thinking part)
   No buttons or screens here, only decisions. That makes it easy to test.
   ===================================================================== */
const Engine = {
  _cache: {},

  // Make text simple: lowercase, no punctuation, single spaces.
  normalize(text) {
    return String(text || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  },

  // Does the text contain this whole word or phrase? ("balloons" matches "balloon")
  hasWord(text, word) {
    const key = word.toLowerCase();
    if (!this._cache[key]) {
      const safe = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      this._cache[key] = new RegExp("(^| )" + safe + "(s|es)?( |$)");
    }
    return this._cache[key].test(text);
  },

  countHits(text, words) {
    return words.filter(w => this.hasWord(text, w)).length;
  },

  // Did the student say they have no idea?
  isUnsure(text) {
    const t = this.normalize(text);
    if (t === "") return true;
    const phrases = ["not sure", "no idea", "dont know", "don t know", "you suggest", "suggest some", "suggest an", "help me choose"];
    return t.length <= 40 && phrases.some(p => t.indexOf(p) !== -1);
  },

  // Safety check of the student's own words.
  // level "unsafe" = refuse. notes = cautions to show. adult = add an "Ask an adult" label.
  screen(text) {
    const t = this.normalize(text);
    for (const rule of UNSAFE_RULES) {
      if (this.countHits(t, rule.words) > 0) return { level: "unsafe", why: rule.why, adult: false, notes: [] };
    }
    const notes = NOTE_RULES.filter(r => this.countHits(t, r.words) > 0).map(r => ({ tag: r.tag, text: r.text }));
    const adult = ADULT_WORDS.some(w => this.hasWord(t, w));
    return { level: "ok", why: "", adult: adult, notes: notes };
  },

  // Give every idea a score for how well it matches the text.
  // Every keyword hit is worth 2 points. A hit on a special word from the title is worth 1 point.
  // Common words such as "model" or "paper" appear in many titles, so they are ignored.
  scoreIdeas(text) {
    const t = this.normalize(text);
    return IDEAS.map(idea => {
      let score = this.countHits(t, idea.keywords) * 2;
      const titleWords = this.normalize(idea.title).split(" ")
        .filter(w => w.length >= 4 && !COMMON_TITLE_WORDS.includes(w));
      score += this.countHits(t, titleWords);
      return { idea: idea, score: score };
    });
  },

  // Guess the topic area(s) from the text.
  detectTopics(text) {
    const t = this.normalize(text);
    const hits = TOPICS.map(tp => ({ tp: tp, n: this.countHits(t, tp.words) }));
    const max = Math.max(...hits.map(h => h.n));
    if (max < 1) return [];
    return hits.filter(h => h.n === max).map(h => h.tp);
  },

  // Decide what to do after the student's FIRST answer.
  //   idea  = one or more ideas match the words well
  //   topic = no exact idea, but the topic area is clear (related ideas are offered)
  //   weak  = a very weak match
  //   none  = nothing matches (Claude will plan it)
  first(text) {
    if (this.isUnsure(text)) return { kind: "unsure", candidates: [] };
    const scores = this.scoreIdeas(text);
    const best = Math.max(...scores.map(s => s.score));
    if (best >= 2) {
      return { kind: "idea", candidates: scores.filter(s => s.score === best).map(s => s.idea) };
    }
    const topics = this.detectTopics(text);
    if (topics.length) {
      const ids = topics.map(t => t.id);
      return { kind: "topic", candidates: IDEAS.filter(i => ids.includes(i.topic)) };
    }
    if (best >= 1) {
      return { kind: "weak", candidates: scores.filter(s => s.score >= 1).map(s => s.idea) };
    }
    return { kind: "none", candidates: [] };
  },

  // Does this idea survive the student's answer to a question?
  keep(idea, qid, value) {
    if (value === "any") return true;
    if (qid === "type") return idea.type === value;
    if (qid === "time") return idea.hours <= Number(value);
    if (qid === "cost") return idea.cost === "home";
    if (qid === "topic") return idea.topic === value;
    return true;
  },

  // Narrow the list. If nothing is left, keep the old list and say we "relaxed".
  applyAnswer(candidates, qid, value) {
    const kept = candidates.filter(i => this.keep(i, qid, value));
    return kept.length ? { candidates: kept, relaxed: false } : { candidates: candidates, relaxed: true };
  },

  // Ask a question ONLY if the answer can change the result.
  // Stop when 3 or fewer ideas are left, or when we reach the question limit.
  nextQuestion(candidates, answered, asked, max) {
    if (candidates.length <= 3 || asked >= max) return null;
    let best = null;
    let bestSplit = 0;
    for (const qid of ["type", "time", "cost"]) {
      if (answered.includes(qid)) continue;
      const q = QUESTIONS[qid];
      let split = 0;
      for (const o of q.options) {
        if (o.value === "any") continue;
        const kept = candidates.filter(i => this.keep(i, qid, o.value)).length;
        split = Math.max(split, Math.min(kept, candidates.length - kept));
      }
      if (split > bestSplit) { best = q; bestSplit = split; }
    }
    return best;
  },

  // Pick the best few ideas: easiest first, then quickest.
  shortlist(list, n) {
    const rank = { easy: 0, medium: 1, hard: 2 };
    return list.slice().sort((a, b) =>
      rank[a.difficulty] - rank[b.difficulty] || a.hours - b.hours
    ).slice(0, n);
  }
};


/* =====================================================================
   PART 2B: THE GUIDE ENGINE
   Turns guide data into parts, true-scale A4 template sheets and checks.
   Everything is in millimetres. No screens here, only decisions and shapes.
   ===================================================================== */
const GUIDE_ADULT_EXTRA = ["craft knife", "scalpel", "needle", "pin", "iron", "heater", "hot", "oven", "microwave", "electric", "sharp"];

const GUIDE_EXAMPLE = {
  title: "Example Exhibit Name",
  concept: "One sentence: the science idea this exhibit shows.",
  why: ["Short paragraph 1 explaining why it works.", "Short paragraph 2."],
  level: "easy",
  hours: 3,
  materials: [
    { item: "A4 plain paper", qty: 1, size: "1 sheet", source: "Notebook or stationery shop", partIds: ["A"], note: "Optional note" },
    { item: "Thread", qty: 2, size: "2 pieces, 200 mm each", source: "Home sewing kit", partIds: ["B"], note: "" }
  ],
  parts: [
    { id: "A", name: "Base", qty: 1, type: "rect", w: 100, h: 60, note: "What this part is for." },
    { id: "B", name: "Thread", qty: 2, type: "item", size: "200 mm each", note: "" }
  ],
  steps: [
    { text: "Print the template sheet at 100% scale and check the 50 mm scale bar with a ruler.", parts: ["A"], adult: false },
    { text: "Cut out part A along the solid line.", parts: ["A"], adult: false },
    { text: "Attach the threads to part A.", parts: ["A", "B"], adult: false }
  ],
  safety: ["One safety rule."],
  tests: ["One thing to test and what you should see."],
  troubleshooting: [{ problem: "What can go wrong", fix: "How to fix it" }],
  viva: [{ q: "Question 1?", a: "Answer 1." }, { q: "Question 2?", a: "Answer 2." }, { q: "Question 3?", a: "Answer 3." }],
  glossary: [{ term: "Word", meaning: "Simple meaning." }, { term: "Word 2", meaning: "Simple meaning." }]
};

const Guide = {
  PAGE: { w: 210, h: 297, margin: 10, gap: 8, labelH: 6, footerH: 20 },
  TAB: 10, BEVEL: 3,
  LEVELS: ["easy", "medium", "hard"],
  TYPES: ["rect", "disc", "box", "frame", "item"],

  isTemplate(p) { return p.type === "rect" || p.type === "disc" || p.type === "box" || p.type === "frame"; },
  winOf(p) { return isFinite(p.win) && p.win > 0 ? p.win : 0; },
  marksOf(p) { return isFinite(p.marks) && p.marks > 0 ? Math.floor(p.marks) : 0; },

  // ---------- geometry ----------
  polygonArea(poly) {
    let a = 0;
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return Math.abs(a) / 2;
  },
  _orient(a, b, c) { return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]); },
  _onSeg(a, b, c) {
    const e = 1e-9;
    return Math.min(a[0], b[0]) <= c[0] + e && c[0] <= Math.max(a[0], b[0]) + e &&
           Math.min(a[1], b[1]) <= c[1] + e && c[1] <= Math.max(a[1], b[1]) + e;
  },
  segsIntersect(p1, p2, p3, p4) {
    const o = this._orient.bind(this), e = 1e-9;
    const d1 = o(p3, p4, p1), d2 = o(p3, p4, p2), d3 = o(p1, p2, p3), d4 = o(p1, p2, p4);
    if (((d1 > e && d2 < -e) || (d1 < -e && d2 > e)) && ((d3 > e && d4 < -e) || (d3 < -e && d4 > e))) return true;
    if (Math.abs(d1) < e && this._onSeg(p3, p4, p1)) return true;
    if (Math.abs(d2) < e && this._onSeg(p3, p4, p2)) return true;
    if (Math.abs(d3) < e && this._onSeg(p1, p2, p3)) return true;
    if (Math.abs(d4) < e && this._onSeg(p1, p2, p4)) return true;
    return false;
  },
  // A cut outline must not cross or touch itself.
  isSimple(poly) {
    const n = poly.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (j === i + 1 || (i === 0 && j === n - 1)) continue;   // neighbours share a corner
        if (this.segsIntersect(poly[i], poly[(i + 1) % n], poly[j], poly[(j + 1) % n])) return false;
      }
    }
    return true;
  },

  // The flat shape of a part: bounding size, cut outline, fold lines, tabs, hole, marks.
  shape(p) {
    const win = this.winOf(p);
    if (p.type === "rect" || p.type === "frame") {
      const w = p.w, h = p.h;
      return { w: w, h: h, outline: [[0, 0], [w, 0], [w, h], [0, h]], folds: [], tabs: [], recv: [], disc: null, marks: [],
        hole: p.type === "frame" && win ? { x: (w - win) / 2, y: (h - win) / 2, w: win, h: win } : null,
        expectedArea: w * h };
    }
    if (p.type === "disc") {
      const r = p.diam / 2, n = this.marksOf(p), marks = [];
      for (let k = 0; k < n; k++) {
        const a = -Math.PI / 2 + 2 * Math.PI * k / n;
        marks.push({ n: k + 1, x: r + 0.82 * r * Math.cos(a), y: r + 0.82 * r * Math.sin(a), lx: r + 0.66 * r * Math.cos(a), ly: r + 0.66 * r * Math.sin(a) });
      }
      return { w: p.diam, h: p.diam, outline: null, folds: [], tabs: [], recv: [], disc: { cx: r, cy: r, r: r }, marks: marks, hole: null,
        expectedArea: Math.PI * r * r };
    }
    if (p.type === "box") {
      const w = p.w, d = p.d, h = p.h, t = this.TAB, b = this.BEVEL;
      const outline = [
        [h, 0], [h + w, 0],
        [h + w + t, b], [h + w + t, h - b], [h + w, h],                          // tab 2 (top right)
        [2 * h + w, h], [2 * h + w, h + d], [h + w, h + d],                      // right wall
        [h + w + t, h + d + b], [h + w + t, 2 * h + d - b], [h + w, 2 * h + d],  // tab 3 (bottom right)
        [h, 2 * h + d],
        [h - t, 2 * h + d - b], [h - t, h + d + b], [h, h + d],                  // tab 4 (bottom left)
        [0, h + d], [0, h], [h, h],                                              // left wall
        [h - t, h - b], [h - t, b]                                               // tab 1 (top left)
      ];
      const tabs = [
        { n: 1, poly: [[h, 0], [h - t, b], [h - t, h - b], [h, h]], cx: h - t / 2, cy: h / 2 },
        { n: 2, poly: [[h + w, 0], [h + w + t, b], [h + w + t, h - b], [h + w, h]], cx: h + w + t / 2, cy: h / 2 },
        { n: 3, poly: [[h + w, h + d], [h + w + t, h + d + b], [h + w + t, 2 * h + d - b], [h + w, 2 * h + d]], cx: h + w + t / 2, cy: h + d + h / 2 },
        { n: 4, poly: [[h, h + d], [h - t, h + d + b], [h - t, 2 * h + d - b], [h, 2 * h + d]], cx: h - t / 2, cy: h + d + h / 2 }
      ];
      const recv = [
        { n: 1, x: h / 2, y: h + 5 }, { n: 2, x: h + w + h / 2, y: h + 5 },
        { n: 3, x: h + w + h / 2, y: h + d - 3 }, { n: 4, x: h / 2, y: h + d - 3 }
      ];
      const folds = [
        [h, h, h + w, h], [h + w, h, h + w, h + d], [h, h + d, h + w, h + d], [h, h, h, h + d],   // base edges
        [h, 0, h, h], [h + w, 0, h + w, h], [h + w, h + d, h + w, 2 * h + d], [h, h + d, h, 2 * h + d]  // tab folds
      ];
      return { w: 2 * h + w, h: 2 * h + d, outline: outline, folds: folds, tabs: tabs, recv: recv, disc: null, marks: [],
        hole: win ? { x: h + (w - win) / 2, y: h + (d - win) / 2, w: win, h: win } : null,
        expectedArea: w * d + 2 * w * h + 2 * d * h + 4 * (h - b) * t };
    }
    return null;
  },

  // Short size text, used on sheets and cards.
  dims(p) {
    const r = x => String(Math.round(x * 10) / 10);
    if (p.type === "rect") return r(p.w) + " × " + r(p.h) + " mm";
    if (p.type === "frame") return r(p.w) + " × " + r(p.h) + " mm, window " + r(this.winOf(p)) + " × " + r(this.winOf(p)) + " mm";
    if (p.type === "disc") return r(p.diam) + " mm across";
    if (p.type === "box") return "base " + r(p.w) + " × " + r(p.d) + " mm, walls " + r(p.h) + " mm high" + (this.winOf(p) ? ", window " + r(this.winOf(p)) + " × " + r(this.winOf(p)) + " mm" : "");
    return p.size || "";
  },

  // ---------- page layout (shelf packing, true scale) ----------
  layout(g) {
    const P = this.PAGE;
    const usableW = P.w - 2 * P.margin, usableH = P.h - P.margin - P.footerH;
    const cells = [], tooBig = [];
    g.parts.forEach((p, idx) => {
      if (!this.isTemplate(p)) return;
      const sh = this.shape(p);
      const copies = p.qty;
      for (let c = 1; c <= copies; c++) {
        const label = p.id + (copies > 1 ? " (" + c + " of " + copies + ")" : "") + "  " + (p.type === "disc" ? p.diam + " mm" : p.type === "box" ? "net " + sh.w + " × " + sh.h : sh.w + " × " + sh.h + " mm");
        const cw = Math.max(sh.w, label.length * 2.3), ch = sh.h + P.labelH;
        if (cw > usableW || ch > usableH) { if (!tooBig.includes(p.id)) tooBig.push(p.id); continue; }
        cells.push({ part: p, copy: c, copies: copies, sh: sh, label: label, cw: cw, ch: ch, order: idx * 100 + c });
      }
    });
    if (tooBig.length) return { pages: null, tooBig: tooBig };
    cells.sort((a, b) => (b.ch - a.ch) || (a.order - b.order));
    const pages = [[]];
    let x = 0, y = 0, rowH = 0;
    for (const c of cells) {
      if (x > 0 && x + c.cw > usableW) { x = 0; y += rowH + P.gap; rowH = 0; }
      if (y + c.ch > usableH) { pages.push([]); x = 0; y = 0; rowH = 0; }
      pages[pages.length - 1].push({ part: c.part, copy: c.copy, copies: c.copies, sh: c.sh, label: c.label, x: P.margin + x, y: P.margin + y, cw: c.cw, ch: c.ch });
      x += c.cw + P.gap;
      rowH = Math.max(rowH, c.ch);
    }
    if (!cells.length) return { pages: [], tooBig: [] };
    return { pages: pages, tooBig: [] };
  },

  pageOf(layout, id) {
    const out = [];
    if (!layout || !layout.pages) return out;
    layout.pages.forEach((pg, i) => { if (pg.some(it => it.part.id === id) && !out.includes(i + 1)) out.push(i + 1); });
    return out;
  },

  // ---------- reading and checking guide data ----------
  normalize(raw) {
    const S = v => typeof v === "string" ? v.trim().slice(0, 2000) : (typeof v === "number" && isFinite(v) ? String(v) : "");
    const N = v => (v === undefined || v === null || v === "" || typeof v === "object" || typeof v === "boolean") ? NaN : Number(v);
    const A = v => Array.isArray(v) ? v.slice(0, 60) : [];
    const O = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
    const SA = v => A(v).map(S).filter(x => x !== "");
    raw = O(raw);
    return {
      title: S(raw.title), concept: S(raw.concept), why: SA(raw.why), level: S(raw.level).toLowerCase(), hours: N(raw.hours),
      materials: A(raw.materials).map(m => { m = O(m); return { item: S(m.item), qty: N(m.qty), size: S(m.size), source: S(m.source), partIds: SA(m.partIds), note: S(m.note) }; }),
      parts: A(raw.parts).map(p => { p = O(p); return { id: S(p.id), name: S(p.name), qty: N(p.qty), type: S(p.type).toLowerCase(), w: N(p.w), h: N(p.h), d: N(p.d), diam: N(p.diam), win: N(p.win), marks: N(p.marks), size: S(p.size), note: S(p.note) }; }),
      steps: A(raw.steps).map(s => { s = O(s); return { text: S(s.text), parts: SA(s.parts), adult: s.adult === true || s.adult === "true" }; }),
      safety: SA(raw.safety), tests: SA(raw.tests),
      troubleshooting: A(raw.troubleshooting).map(t => { t = O(t); return { problem: S(t.problem), fix: S(t.fix) }; }),
      viva: A(raw.viva).map(t => { t = O(t); return { q: S(t.q), a: S(t.a) }; }),
      glossary: A(raw.glossary).map(t => { t = O(t); return { term: S(t.term), meaning: S(t.meaning) }; })
    };
  },

  allText(g) {
    const t = [g.title, g.concept, ...g.why, ...g.safety, ...g.tests];
    g.materials.forEach(m => t.push(m.item, m.size, m.source, m.note));
    g.parts.forEach(p => t.push(p.name, p.size, p.note));
    g.steps.forEach(s => t.push(s.text));
    g.troubleshooting.forEach(x => t.push(x.problem, x.fix));
    g.viva.forEach(x => t.push(x.q, x.a));
    g.glossary.forEach(x => t.push(x.term, x.meaning));
    return t;
  },

  // Returns { errors, warnings, layout }. A guide is only shown when errors is empty.
  validate(g) {
    const errors = [], warnings = [];
    const err = m => errors.push(m), warn = m => warnings.push(m);
    const inRange = (v, lo, hi) => typeof v === "number" && isFinite(v) && v >= lo && v <= hi;
    const need = (cond, m) => { if (!cond) err(m); };

    need(g.title.length >= 3, "The guide needs a title.");
    need(g.concept.length >= 10, "The guide needs a one-sentence science concept.");
    need(g.why.length >= 1, "The guide needs a “why it works” explanation.");
    need(this.LEVELS.includes(g.level), "Level must be easy, medium or hard.");
    need(inRange(g.hours, 0.5, 40), "Build time (hours) must be a number from 0.5 to 40.");
    need(g.materials.length >= 1 && g.materials.length <= 30, "The materials list needs 1 to 30 items.");
    need(g.parts.length >= 1 && g.parts.length <= 20, "The guide needs 1 to 20 parts.");
    need(g.steps.length >= 3 && g.steps.length <= 30, "The guide needs 3 to 30 assembly steps.");
    need(g.safety.length >= 1, "The guide needs at least one safety note.");
    need(g.tests.length >= 1, "The guide needs at least one thing to test.");
    need(g.troubleshooting.length >= 1, "The guide needs a troubleshooting list.");
    need(g.viva.length >= 3, "The guide needs 3 viva questions with answers.");
    need(g.glossary.length >= 1, "The guide needs a glossary.");

    // part ids
    const ids = [];
    g.parts.forEach((p, i) => {
      const where = "Part " + (i + 1) + (p.id ? " (" + p.id + ")" : "");
      if (!/^[A-Za-z0-9]{1,3}$/.test(p.id)) err(where + ": the id must be 1 to 3 letters or digits.");
      else if (ids.includes(p.id.toUpperCase())) err(where + ": the id is used twice.");
      else ids.push(p.id.toUpperCase());
      need(p.name.length >= 2, where + ": it needs a name.");
      need(Number.isInteger(p.qty) && p.qty >= 1 && p.qty <= 20, where + ": quantity must be a whole number from 1 to 20.");
      need(this.TYPES.includes(p.type), where + ": type must be rect, disc, box, frame or item.");
      const win = this.winOf(p);
      if (p.type === "rect") need(inRange(p.w, 5, 250) && inRange(p.h, 5, 250), where + ": rect needs w and h from 5 to 250 mm.");
      if (p.type === "frame") {
        need(inRange(p.w, 20, 250) && inRange(p.h, 20, 250), where + ": frame needs w and h from 20 to 250 mm.");
        need(inRange(p.win, 3, Math.min(p.w, p.h) - 10), where + ": the window must be at least 3 mm and leave a 5 mm border.");
      }
      if (p.type === "disc") {
        need(inRange(p.diam, 20, 190), where + ": disc needs diam from 20 to 190 mm.");
        need(isNaN(p.marks) || (Number.isInteger(p.marks) && p.marks >= 0 && p.marks <= 16), where + ": marks must be a whole number from 0 to 16.");
      }
      if (p.type === "box") {
        need(inRange(p.w, 20, 120) && inRange(p.d, 20, 120), where + ": box needs w and d from 20 to 120 mm.");
        need(inRange(p.h, 15, 120), where + ": box needs wall height h from 15 to 120 mm.");
        need(isNaN(p.win) || p.win === 0 || inRange(p.win, 3, Math.min(p.w, p.d) - 10), where + ": the window in the base must be at least 3 mm and leave a 5 mm border.");
      }
      if (p.type === "item") need(p.size.length >= 2, where + ": an item needs a size or description.");
      if (win && p.type === "item") warn(where + ": a window on an item is ignored.");
    });

    // materials
    g.materials.forEach((m, i) => {
      const where = "Material " + (i + 1);
      need(m.item.length >= 2, where + ": it needs a name.");
      need(inRange(m.qty, 1, 99) && Number.isInteger(m.qty), where + " (" + m.item + "): quantity must be a whole number from 1 to 99.");
      need(m.size.length >= 1, where + " (" + m.item + "): it needs a size or amount.");
      need(m.source.length >= 2, where + " (" + m.item + "): it needs a place to get it locally.");
      m.partIds.forEach(id => need(ids.includes(id.toUpperCase()), where + " (" + m.item + "): it lists part “" + id + "”, which does not exist."));
    });

    // steps: part references, adult labels, usage
    const used = {};
    const extraAdult = GUIDE_ADULT_EXTRA;
    g.steps.forEach((s, i) => {
      const where = "Step " + (i + 1);
      need(s.text.length >= 8, where + ": it needs some text.");
      s.parts.forEach(id => { if (!ids.includes(id.toUpperCase())) err(where + ": it uses part “" + id + "”, which does not exist."); else used[id.toUpperCase()] = true; });
      const t = Engine.normalize(s.text);
      const hit = ADULT_WORDS.concat(extraAdult).find(w => Engine.hasWord(t, w));
      if (hit && !s.adult) err(where + ": it mentions “" + hit + "”, so it must be marked “Ask an adult” (adult: true).");
    });
    g.parts.forEach(p => {
      if (p.id && !used[p.id.toUpperCase()]) err("Part " + p.id + " (" + p.name + ") is never used in any assembly step.");
      if (p.id && !g.materials.some(m => m.partIds.some(x => x.toUpperCase() === p.id.toUpperCase()))) warn("Part " + p.id + " (" + p.name + ") is not linked to any item in the materials list.");
    });

    // other lists
    g.troubleshooting.forEach((t, i) => need(t.problem && t.fix, "Troubleshooting " + (i + 1) + ": it needs a problem and a fix."));
    g.viva.forEach((t, i) => need(t.q && t.a, "Viva question " + (i + 1) + ": it needs a question and an answer."));
    g.glossary.forEach((t, i) => need(t.term && t.meaning, "Glossary entry " + (i + 1) + ": it needs a term and a meaning."));

    // text rules
    this.allText(g).forEach(t => { if (t.length > 600) err("One text is too long (over 600 characters): “" + t.slice(0, 40) + "…”"); });
    const joined = this.allText(g).join(" \n ");
    if (/<|>|https?:|www\./i.test(joined)) err("The guide contains a web address or code characters (< > http www). Please remove them.");
    if (new RegExp("\\b" + ["ca", "non"].join("") + "\\b", "i").test(joined)) err("The guide names a reference site. Please remove the name.");

    // safety screen of what the student is asked to do
    const doText = [g.title].concat(g.materials.map(m => m.item), g.parts.map(p => p.name), g.steps.map(s => s.text)).join(" . ");
    const sc = Engine.screen(doText);
    if (sc.level === "unsafe") err("The guide involves something unsafe for a student (" + sc.why + ").");
    else sc.notes.forEach(n => warn(n.tag + ": " + n.text));

    // geometry self-check and layout
    let layout = null;
    const partErrors = errors.length;
    if (!partErrors) {
      g.parts.forEach(p => {
        if (!this.isTemplate(p)) return;
        const sh = this.shape(p);
        if (sh.outline) {
          if (!this.isSimple(sh.outline)) err("Part " + p.id + ": the cut outline crosses itself.");
          if (Math.abs(this.polygonArea(sh.outline) - sh.expectedArea) > 0.01) err("Part " + p.id + ": the cut outline area does not match its size.");
        }
      });
      layout = this.layout(g);
      if (layout.tooBig.length) err("Part " + layout.tooBig.join(", ") + " is too big to print on one A4 page (largest allowed flat size is 190 × 261 mm).");
      if (layout.pages && layout.pages.length > 6) err("The templates need more than 6 pages. Please make the parts smaller or fewer.");
    }
    return { errors: errors, warnings: warnings, layout: layout };
  },

  // Parts that cannot be printed on one A4 page become loose items to measure and cut by hand.
  // Returns a list of friendly notes about what was changed.
  autoFix(g) {
    const notes = [], P = this.PAGE;
    const maxW = P.w - 2 * P.margin, maxH = P.h - P.margin - P.footerH - P.labelH;
    const pos = v => typeof v === "number" && isFinite(v) && v > 0;
    g.parts.forEach(p => {
      if (!this.isTemplate(p)) return;
      let fw = NaN, fh = NaN;
      if ((p.type === "rect" || p.type === "frame") && pos(p.w) && pos(p.h)) { fw = p.w; fh = p.h; }
      else if (p.type === "disc" && pos(p.diam)) { fw = fh = p.diam; }
      else if (p.type === "box" && pos(p.w) && pos(p.d) && pos(p.h)) { fw = 2 * p.h + p.w; fh = 2 * p.h + p.d; }
      if (!isFinite(fw)) return;
      if (fw > maxW || fh > maxH) {
        const size = this.dims(p) + " (too big for an A4 template: measure it and cut it from chart paper or card)";
        notes.push("Part " + p.id + " (" + p.name + ") is too big to print on A4, so it is shown as a loose item: " + this.dims(p) + ".");
        p.type = "item"; p.size = size; p.win = NaN; p.marks = NaN;
      }
    });
    return notes;
  },

  // Read text pasted from Claude: finds the JSON, normalizes it and checks it.
  parse(text) {
    const out = { guide: null, errors: [], warnings: [] };
    let t = String(text || "");
    if (t.trim() === "") { out.errors.push("The box is empty. Paste Claude's reply first."); return out; }
    if (t.length > 80000) { out.errors.push("The pasted text is too long. Paste only the code block that Claude sent."); return out; }
    const fence = t.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
    if (fence && fence[1].indexOf("{") !== -1) t = fence[1];
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b < a) { out.errors.push("I could not find any guide data. Paste the whole code block that starts with { and ends with }."); return out; }
    let raw;
    try { raw = JSON.parse(t.slice(a, b + 1)); }
    catch (e) { out.errors.push("The guide data has a typing mistake and cannot be read (" + e.message + "). Ask Claude to send the complete guide data again in one code block."); return out; }
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) { out.errors.push("The guide data must be one object that starts with {."); return out; }
    const g = this.normalize(raw);
    const fixed = this.autoFix(g);
    const v = this.validate(g);
    out.errors = v.errors; out.warnings = fixed.concat(v.warnings);
    if (!v.errors.length) out.guide = g;
    return out;
  },

  get(id) { return GUIDES[id] ? this.normalize(GUIDES[id]) : null; },

  // The rules and data shape Claude must follow. This is added to the one prompt the student sends.
  rulesText() {
    return [
      "When you have what you need, reply with ONE code block of valid JSON and nothing else. Use exactly this shape and replace the example values:",
      "",
      JSON.stringify(GUIDE_EXAMPLE),
      "",
      "Rules for the JSON:",
      "- Sizes are in millimetres and must be correct. Part types: \"rect\" (w, h), \"disc\" (diam, marks = number of numbered points or 0), \"frame\" (w, h, win = square window in the middle), \"box\" (open-top box net: w, d, h = wall height at least 15, win = optional square window in the base), \"item\" (a loose thing such as thread, or anything bigger than A4: give size as text).",
      "- A template part must fit on an A4 page (about 190 x 260 mm). A box net is (2h + w) wide and (2h + d) tall. Anything bigger must be type \"item\".",
      "- Part ids are 1 to 3 letters or digits. Every part must be used in at least one step. A material that becomes a part lists that part id in partIds.",
      "- Steps are in the order a beginner should do them, with no numbers in the text. Mark any step with a knife, pin, heat or anything sharp with \"adult\": true.",
      "- Include 3 viva questions with answers, a glossary, safety notes, things to test and troubleshooting.",
      "- Use materials from home or a local shop and say where each comes from.",
      "- Keep each text under 600 characters. No web addresses, no < or > characters, and no website names.",
      "- Only include facts and sizes you are sure about."
    ].join("\n");
  }
};



/* =====================================================================
   PART 2D: ASSEMBLY PICTURES
   A picture ("scene") is a short list of simple shapes on a 400 x 300 canvas.
   The same list format is used for the built-in guides (drawn by hand below)
   and for pictures that Claude draws, so everything is checked the same way.
   ===================================================================== */
const SCENE = { W: 400, H: 300, MAX_ITEMS: 90,
  FILLS: { none: "none", paper: "#ffffff", card: "#dcc194", dark: "#3a3a3a", grey: "#d4d4d4", foil: "#c3cad4", clay: "#d08a5a", trace: "#e6f1f8", hl: "#dce9fa" },
  STROKES: { ink: "#111111", hl: "#0b4f9c", grey: "#808080", none: "none", white: "#ffffff" },
  KINDS: { rect: ["x", "y", "w", "h"], circle: ["cx", "cy", "r"], ellipse: ["cx", "cy", "rx", "ry"], poly: [], line: ["x1", "y1", "x2", "y2"],
    arrow: ["x1", "y1", "x2", "y2"], text: ["x", "y"], label: ["x", "y"], dim: ["x1", "y1", "x2", "y2"], part: ["x", "y", "s"] }
};

const Scenes = {
  // Clean one picture. Unknown items are dropped and reported. Returns { items, problems }.
  clean(items, g, where) {
    const problems = [], out = [];
    const num = v => typeof v === "number" && isFinite(v) && v >= -200 && v <= 700;
    if (!Array.isArray(items)) return { items: [], problems: [where + ": the picture must be a list."] };
    if (items.length > SCENE.MAX_ITEMS) problems.push(where + ": too many shapes (more than " + SCENE.MAX_ITEMS + "), extra ones ignored.");
    items.slice(0, SCENE.MAX_ITEMS).forEach((it, i) => {
      const tag = where + " shape " + (i + 1);
      if (!it || typeof it !== "object" || Array.isArray(it) || !SCENE.KINDS[it.t]) { problems.push(tag + ": unknown kind of shape."); return; }
      const c = { t: it.t };
      for (const k of SCENE.KINDS[it.t]) {
        const v = typeof it[k] === "string" && it[k].trim() !== "" ? Number(it[k]) : it[k];
        if (!num(v)) { problems.push(tag + ": “" + k + "” must be a number between -200 and 700."); return; }
        c[k] = v;
      }
      if (it.t === "rect" && !(c.w >= 0 && c.h >= 0)) { problems.push(tag + ": size must not be negative."); return; }
      if ((it.t === "circle" && !(c.r >= 0 && c.r <= 400)) || (it.t === "ellipse" && !(c.rx >= 0 && c.ry >= 0 && c.rx <= 400 && c.ry <= 400))) { problems.push(tag + ": radius out of range."); return; }
      if (it.t === "poly") {
        if (!Array.isArray(it.pts) || it.pts.length < 3 || it.pts.length > 24 || !it.pts.every(p => Array.isArray(p) && p.length === 2 && num(p[0]) && num(p[1]))) { problems.push(tag + ": a polygon needs 3 to 24 points like [x, y]."); return; }
        c.pts = it.pts.map(p => [p[0], p[1]]);
      }
      if (it.t === "text" || it.t === "dim") {
        const s = typeof it.s === "string" ? it.s.trim() : (typeof it.s === "number" ? String(it.s) : "");
        if (it.t === "text" && !s) { problems.push(tag + ": text is empty."); return; }
        if (s.length > 60) { problems.push(tag + ": text is longer than 60 characters."); return; }
        if (/[<>]|https?:|www\./i.test(s)) { problems.push(tag + ": text contains a web address or code characters."); return; }
        c.s = s;
      }
      if (it.t === "label" || it.t === "part") {
        const id = typeof it.id === "string" ? it.id.trim() : "";
        if (!/^[A-Za-z0-9]{1,3}$/.test(id)) { problems.push(tag + ": id must be 1 to 3 letters or digits."); return; }
        if (it.t === "part") {
          const p = g.parts.find(q => q.id.toUpperCase() === id.toUpperCase());
          if (!p || !Guide.isTemplate(p)) { problems.push(tag + ": part “" + id + "” has no printed template."); return; }
          if (!(c.s >= 0.05 && c.s <= 6)) { problems.push(tag + ": scale s must be from 0.05 to 6."); return; }
          c.id = p.id;
        } else c.id = id;
      }
      if (it.fill !== undefined) { if (!SCENE.FILLS[it.fill]) { problems.push(tag + ": unknown fill “" + String(it.fill).slice(0, 12) + "”."); return; } c.fill = it.fill; }
      if (it.stroke !== undefined) { if (!SCENE.STROKES[it.stroke]) { problems.push(tag + ": unknown stroke “" + String(it.stroke).slice(0, 12) + "”."); return; } c.stroke = it.stroke; }
      if (it.sw !== undefined) { if (!(typeof it.sw === "number" && it.sw >= 0.5 && it.sw <= 6)) { problems.push(tag + ": sw must be from 0.5 to 6."); return; } c.sw = it.sw; }
      if (it.size !== undefined) { if (!(typeof it.size === "number" && it.size >= 8 && it.size <= 24)) { problems.push(tag + ": size must be from 8 to 24."); return; } c.size = it.size; }
      if (it.r !== undefined && it.t === "rect") { if (!(typeof it.r === "number" && it.r >= 0 && it.r <= 100)) { problems.push(tag + ": r must be from 0 to 100."); return; } c.r = it.r; }
      if (it.anchor !== undefined) { if (!["start", "middle", "end"].includes(it.anchor)) { problems.push(tag + ": anchor must be start, middle or end."); return; } c.anchor = it.anchor; }
      ["dash", "hl", "bold", "dark"].forEach(k => { if (it[k] === true) c[k] = true; });
      out.push(c);
    });
    return { items: out, problems: problems };
  },

  // Clean a whole set: { overview: [{title, caption, items}], steps: [{items}, ...] }.
  // One item per written step. Returns { visuals, problems }.
  cleanAll(raw, g) {
    const problems = [], vis = { overview: [], steps: [] };
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { visuals: null, problems: ["The pictures must be one object with “overview” and “steps”."] };
    const T = v => (typeof v === "string" ? v.trim().slice(0, 140) : "");
    (Array.isArray(raw.overview) ? raw.overview.slice(0, 4) : []).forEach((o, i) => {
      o = o && typeof o === "object" ? o : {};
      const r = this.clean(o.items, g, "Overview picture " + (i + 1)); problems.push(...r.problems);
      if (r.items.length) vis.overview.push({ title: T(o.title) || "Picture " + (i + 1), caption: T(o.caption), items: r.items });
    });
    const steps = Array.isArray(raw.steps) ? raw.steps : [];
    if (steps.length !== g.steps.length) problems.push("There must be exactly one picture for each of the " + g.steps.length + " steps (you sent " + steps.length + "). Use an empty list for a step with no picture.");
    g.steps.forEach((st, i) => {
      const o = steps[i] && typeof steps[i] === "object" ? steps[i] : {};
      const r = this.clean(o.items === undefined ? [] : o.items, g, "Step " + (i + 1) + " picture"); problems.push(...r.problems);
      vis.steps.push({ items: r.items, note: T(o.note) });
    });
    if (!vis.steps.some(s => s.items.length)) problems.push("None of the steps has a picture.");
    return { visuals: problems.length ? null : vis, problems: problems };
  },

  // Read the text Claude sends back for pictures.
  parse(text, g) {
    const out = { visuals: null, errors: [] };
    let t = String(text || "");
    if (t.trim() === "") { out.errors.push("The box is empty. Paste Claude's reply first."); return out; }
    if (t.length > 120000) { out.errors.push("The pasted text is too long. Paste only the code block."); return out; }
    const fence = t.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
    if (fence && fence[1].indexOf("{") !== -1) t = fence[1];
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b < a) { out.errors.push("I could not find any picture data. Paste the whole code block that starts with { and ends with }."); return out; }
    let raw;
    try { raw = JSON.parse(t.slice(a, b + 1)); } catch (e) { out.errors.push("The picture data has a typing mistake (" + e.message + "). Ask Claude to send it again in one complete code block."); return out; }
    const r = this.cleanAll(raw, g);
    out.errors = r.problems; out.visuals = r.visuals;
    return out;
  },

  example() {
    return JSON.stringify({
      overview: [{ title: "All the parts", caption: "Short caption", items: [{ t: "part", id: "A", x: 20, y: 30, s: 0.9 }, { t: "label", x: 60, y: 20, id: "A" }] }],
      steps: [
        { note: "Optional hint", items: [{ t: "rect", x: 100, y: 80, w: 120, h: 60, fill: "card" }, { t: "arrow", x1: 60, y1: 110, x2: 98, y2: 110 }, { t: "text", x: 100, y: 70, s: "Glue here", size: 12 }] },
        { items: [] }
      ]
    });
  },

  // The prompt that asks Claude to draw the pictures for a guide that is already built.
  prompt(g) {
    const parts = g.parts.map(p => p.id + " = " + p.name + (Guide.isTemplate(p) ? " (has a printed template, so a \"part\" shape can draw it)" : " (loose item)")).join("; ");
    return [
      "Now please draw simple assembly pictures for the same guide, so I can see how the parts fit together.",
      "Reply with ONE code block of valid JSON and nothing else:",
      Scenes.example(),
      "",
      "Rules:",
      "- \"overview\" has 1 or 2 pictures (for example the parts laid out, and how it works). \"steps\" has exactly " + g.steps.length + " entries, one for each written step in order. Use \"items\": [] for a step that needs no picture.",
      "- Each picture is drawn on a canvas 400 wide and 300 tall, with 0,0 at the top left. Keep everything inside it, and use big, clear shapes.",
      "- Shapes: rect (x, y, w, h, r), circle (cx, cy, r), ellipse (cx, cy, rx, ry), poly (pts = list of [x, y]), line (x1, y1, x2, y2, dash), arrow (x1, y1, x2, y2), text (x, y, s, size 8 to 24, anchor, bold), label (x, y, id = a part letter in a circle), dim (x1, y1, x2, y2, s = a size such as \"50 mm\"), part (id, x, y, s = pixels per mm; draws the real printed template of that part).",
      "- Optional on any shape: fill (none, paper, card, dark, grey, foil, clay, trace, hl), stroke (ink, hl, grey, none, white), sw (line width 0.5 to 6), hl: true to highlight the part that is new in this step, dark: true on a part.",
      "- Parts in this guide: " + parts + ".",
      "- Every picture must match its written step and the real sizes. Mark the new part with hl: true and label parts with their letters. Do not rely on colour alone.",
      "- Keep every text under 60 characters. No web addresses and no < or > characters.",
      "- If you cannot draw a step correctly, use an empty list for it instead of guessing."
    ].join("\n");
  }
};

/* ---------- Pictures drawn by hand for the built-in guides ---------- */
const VB = (() => {   // small shape helpers
  const o = (a, b) => Object.assign(a, b || {});
  const r1 = v => Math.round(v * 10) / 10;
  return {
    rect: (x, y, w, h, e) => o({ t: "rect", x: r1(x), y: r1(y), w: r1(w), h: r1(h) }, e),
    circ: (cx, cy, r, e) => o({ t: "circle", cx: r1(cx), cy: r1(cy), r: r1(r) }, e),
    ell: (cx, cy, rx, ry, e) => o({ t: "ellipse", cx: r1(cx), cy: r1(cy), rx: r1(rx), ry: r1(ry) }, e),
    poly: (pts, e) => o({ t: "poly", pts: pts.map(p => [r1(p[0]), r1(p[1])]) }, e),
    line: (x1, y1, x2, y2, e) => o({ t: "line", x1: r1(x1), y1: r1(y1), x2: r1(x2), y2: r1(y2) }, e),
    arrow: (x1, y1, x2, y2, e) => o({ t: "arrow", x1: r1(x1), y1: r1(y1), x2: r1(x2), y2: r1(y2) }, e),
    text: (x, y, s, e) => o({ t: "text", x: r1(x), y: r1(y), s: s }, e),
    label: (x, y, id) => ({ t: "label", x: r1(x), y: r1(y), id: id }),
    dim: (x1, y1, x2, y2, s) => ({ t: "dim", x1: r1(x1), y1: r1(y1), x2: r1(x2), y2: r1(y2), s: s }),
    part: (id, x, y, s, e) => o({ t: "part", id: id, x: r1(x), y: r1(y), s: Math.round(s * 1000) / 1000 }, e)
  };
})();


/* =====================================================================
   PART 2E: THE 3D STUDIO
   A tiny 3D drawing engine (no libraries). A model describes parts as flat faces in
   millimetres. The studio turns them, shades them in four tones, sorts them back to front,
   and draws them as SVG. Steps are animated by changing a few numbers (fold angle, lift...).
   ===================================================================== */
const Studio = {
  W: 600, H: 420,
  now() { return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now(); },
  mix(a, b, t) { return a + (b - a) * t; },
  ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; },
  hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; },
  toHex(a) { return "#" + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join(""); },
  mixColor(a, b, t) { const A = this.hex(a), B = this.hex(b); return this.toHex(A.map((v, i) => this.mix(v, B[i], t))); },
  shade(c, k) { return this.toHex(this.hex(c).map(v => v * k)); },
  lerp3(a, b, t) { return [this.mix(a[0], b[0], t), this.mix(a[1], b[1], t), this.mix(a[2], b[2], t)]; },

  // A list of values: the value at the start, then the value after each step.
  keys(N, start, changes) {
    const a = [start]; let cur = start;
    for (let i = 1; i <= N; i++) { if (changes && changes[i] !== undefined) cur = changes[i]; a.push(cur); }
    return a;
  },

  // Rotate point p about the line a->b by angle ang (radians).
  rotLine(p, a, b, ang) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], L = Math.hypot(ux, uy, uz), k = [ux / L, uy / L, uz / L];
    const v = [p[0] - a[0], p[1] - a[1], p[2] - a[2]], c = Math.cos(ang), s = Math.sin(ang);
    const kv = k[0] * v[0] + k[1] * v[1] + k[2] * v[2];
    const cr = [k[1] * v[2] - k[2] * v[1], k[2] * v[0] - k[0] * v[2], k[0] * v[1] - k[1] * v[0]];
    return [a[0] + v[0] * c + cr[0] * s + k[0] * kv * (1 - c), a[1] + v[1] * c + cr[1] * s + k[1] * kv * (1 - c), a[2] + v[2] * c + cr[2] * s + k[2] * kv * (1 - c)];
  },

  // The numbers at a moment: step = -1 is the start, otherwise step i (0 based) with progress t from 0 to 1.
  paramsAt(model, step, t) {
    const P = {};
    for (const name in model.keys) {
      const arr = model.keys[name];
      if (step < 0) { P[name] = arr[0]; continue; }
      const w = (model.win && model.win[name] && model.win[name][step + 1]) || [0, 1];
      const u = this.ease(this.clamp01((t - w[0]) / Math.max(1e-6, w[1] - w[0])));
      P[name] = this.mix(arr[step], arr[step + 1], u);
    }
    return P;
  },

  makeView(yaw, pitch) { return { cy: Math.cos(yaw), sy: Math.sin(yaw), cp: Math.cos(pitch), sp: Math.sin(pitch) }; },
  toView(p, v) { return [p[0] * v.cy - p[1] * v.sy, p[0] * v.sy + p[1] * v.cy, p[2]]; },

  // Turn a scene into things to draw, sorted from far to near.
  frame(model, P, cam, active) {
    const sc = model.scene(P), v = this.makeView(cam.yaw, cam.pitch), self = this;
    const T = this.toView([P.tx, P.ty, P.tz], v), tX = T[0], tU = T[2] * v.cp + T[1] * v.sp;
    const scale = model.base * P.zoom;
    const proj = p => { const r = self.toView(p, v); return { x: self.W / 2 + (r[0] - tX) * scale, y: self.H * 0.56 - ((r[2] * v.cp + r[1] * v.sp) - tU) * scale, d: r[1] * v.cp - r[2] * v.sp, r: r }; };
    const L = (() => { const a = [-0.35, -0.45, 0.82], n = Math.hypot(...a); return a.map(x => x / n); })();
    const TONES = [0.6, 0.76, 0.9, 1.04];
    const prims = [];
    let seq = 0;
    const act = active || new Set();
    const rd = n => Math.round(n * 10) / 10;
    sc.items.forEach(it => {
      const hl = it.part && act.has(it.part);
      if (it.k === "face") {
        const q = it.pts.map(proj);
        let nx = 0, ny = 0, nz = 0;
        for (let i = 0; i < q.length; i++) {      // Newell's method for the normal
          const a = q[i].r, b = q[(i + 1) % q.length].r;
          nx += (a[1] - b[1]) * (a[2] + b[2]); ny += (a[2] - b[2]) * (a[0] + b[0]); nz += (a[0] - b[0]) * (a[1] + b[1]);
        }
        const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
        const front = (-ny * v.cp + nz * v.sp) > 0;
        const f = front ? 1 : -1;
        const I = Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2]) * f);
        const tone = TONES[Math.min(3, Math.floor(I * 4))];
        const base = front ? it.out : (it.inn || it.out);
        let d = q.reduce((s, p) => s + p.d, 0) / q.length, hideDeco = false;
        if (it.side) d += ((it.side > 0) === front) ? -2.5 : 2.5;           // a thin sheet lying on another face
        if (it.deep) d += 35;                                                 // the floor of an upright box: behind its near walls
        if (it.inside) {                                                      // a flap inside a box, next to a wall
          const cc = proj(it.inside).r, cen = [0, 1, 2].map(i => q.reduce((s, p) => s + p.r[i], 0) / q.length);
          const side = (cen[0] - cc[0]) * nx + (cen[1] - cc[1]) * ny + (cen[2] - cc[2]) * nz;
          const outFront = ((-ny * v.cp + nz * v.sp) * (side >= 0 ? 1 : -1)) > 0;   // the wall beside it faces the camera
          d += outFront ? 35 : -4; hideDeco = outFront;
        }
        const fillC = this.shade(base, tone);
        prims.push({ k: "poly", pts: q.map(p => [rd(p.x), rd(p.y)]), fill: fillC, stroke: it.seam ? fillC : (hl ? "#0b4f9c" : "#6b7078"), sw: it.seam ? 0.8 : (hl ? 2.2 : 0.6), op: it.op === undefined ? 1 : it.op, depth: d, seq: seq++ });
        if (front && it.deco && !hideDeco) it.deco.forEach(dc => {
          const a = proj(dc.p), b = proj(dc.q);
          prims.push({ k: "line", x1: rd(a.x), y1: rd(a.y), x2: rd(b.x), y2: rd(b.y), stroke: hl && !dc.dash ? "#0b4f9c" : "#111", sw: (dc.dash ? 1.1 : 1.4) + (hl ? 1.1 : 0), dash: dc.dash ? "5 3" : "", op: it.op === undefined ? 1 : it.op, depth: d, seq: seq++ });
        });
      } else if (it.k === "line") {
        const a = proj(it.pts[0]), b = proj(it.pts[1]);
        prims.push({ k: "line", x1: rd(a.x), y1: rd(a.y), x2: rd(b.x), y2: rd(b.y), stroke: hl ? "#0b4f9c" : (it.color || "#444"), sw: (it.w || 1.5) + (hl ? 0.8 : 0), dash: it.dash || "", op: it.op === undefined ? 1 : it.op, depth: (a.d + b.d) / 2 - 0.3, seq: seq++ });
      } else if (it.k === "ball") {
        const c = proj(it.c), r = it.r * scale;
        prims.push({ k: "circ", cx: rd(c.x), cy: rd(c.y), r: rd(r), fill: this.shade(it.fill, 0.92), hi: this.shade(it.fill, 1.18), stroke: hl ? "#0b4f9c" : "#6b7078", sw: hl ? 2.2 : 0.6, op: it.op === undefined ? 1 : it.op, depth: c.d + (it.deep ? 35 : 0), seq: seq++ });
      }
    });
    prims.sort((a, b) => (b.depth - a.depth) || (a.seq - b.seq));
    const labels = sc.labels.map(lb => { const p = proj(lb.p); return { id: lb.part, x: rd(p.x), y: rd(p.y), hl: act.has(lb.part) }; });
